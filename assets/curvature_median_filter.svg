<style>
  svg { --surface: #fcfcfb; --t1: #0b0b0b; --t2: #52514e; --t3: #8a8984; --grid: #e4e3df; --line: #b5b4ae;
        --raw: #eb6834; --med: #2a78d6; --win: #e6eef8; }
  @media (prefers-color-scheme: dark) {
    svg { --surface: #1a1a19; --t1: #f0efec; --t2: #c3c2b7; --t3: #8f8e86; --grid: #33332f; --line: #6b6a64;
          --raw: #d95926; --med: #3987e5; --win: #1f2a38; }
  }
  .bg { fill: var(--surface); }
  .t1 { fill: var(--t1); font-size: 15px; font-weight: 600; }
  .t2 { fill: var(--t2); font-size: 12.5px; }
  .t3 { fill: var(--t3); font-size: 11.5px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--line); stroke-width: 1; }
  .center { fill: none; stroke: var(--line); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .raw { fill: none; stroke: var(--raw); stroke-width: 2; stroke-linejoin: round; }
  .med { fill: none; stroke: var(--med); stroke-width: 2; stroke-linejoin: round; }
  .ref { stroke: var(--t3); stroke-width: 1; stroke-dasharray: 4 4; }
  .win { fill: var(--win); }
  .lead { stroke: var(--t3); stroke-width: 1; fill: none; }
  .dot-raw { fill: var(--raw); stroke: var(--surface); stroke-width: 2; }
  .dot-c { fill: var(--surface); stroke: var(--t2); stroke-width: 1.5; }
</style>
