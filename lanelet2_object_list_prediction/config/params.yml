/**/*:
  ros__parameters:

    input:
      ego_data_timeout: 1.0                                     # timeout for considering ego vehicle data [s]

    processing:
      map_matching:
        ll2_map_server_name: lanelet2_map_server                # name of lanelet2_map_server node
        max_distance: 0.5                                       # max distance from a lanelet to consider it a match [m]
        max_delta_yaw_deg: 90.0                                 # max yaw difference from a lanelet direction to consider it a match [deg]
        fallback_mode: kinematic                                # fallback mode for objects not matched to map [kinematic|static]
      kinematic_limitations:
        enable: true                                            # enable kinematic limitations
        max_lateral_acceleration: 2.5                           # max lateral acceleration for predictions [m/s^2]
        max_longitudinal_deceleration: 2.0                      # max longitudinal deceleration for predictions [m/s^2]
        max_longitudinal_acceleration: 1.0                      # max longitudinal acceleration for predictions [m/s^2]
      yielding:
        enable: true                                            # enable yielding
        clearance_distance: 0.5                                 # clearance between front and yield line [m]
        clearance_time: 1.0                                     # time to wait after priority traffic has cleared [s]
      following:
        enable: true                                            # enable following, avoiding collisions with leading objects
        headway_distance: 2.0                                   # min distance to the leading object [m]
        headway_time: 1.0                                       # min time headway to the leading object [s]
      roundabout:
        enable: true                                            # enable special roundabout handling
        initial_alignment_tolerance: 1.0                        # tolerance for initial alignment with roundabout centerline, not respecting kinematic limitations [m]

    output:
      prediction_horizon: 5.0                                   # prediction time horizon [s]
      sample_interval: 0.5                                      # time interval between prediction samples [s]
      infeasible_hypothesis_probability: 0.0                    # probability for infeasible hypotheses
